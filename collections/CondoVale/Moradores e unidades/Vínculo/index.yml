info:
  name: index
  type: http
  seq: 1

http:
  method: GET
  url: "{{API_URL}}/unit-occupancies?relations=user;unit&limit=10"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: relations
      value: user;unit
      type: query
    - name: limit
      value: "10"
      type: query
    - name: filters
      value: is_active:=:1
      type: query
      disabled: true
    - name: sort
      value: started_at
      type: query
      disabled: true
    - name: direction
      value: desc
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
