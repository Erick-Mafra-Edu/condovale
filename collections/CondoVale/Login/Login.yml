info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{API_URL}}/auth/login"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{USER_LOGIN}}",
        "password": "{{USER_PASSWORD}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
