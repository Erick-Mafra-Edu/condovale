info:
  name: store
  type: http
  seq: 3

http:
  method: POST
  url: "{{API_URL}}/occurrences/1/attachments"
  headers:
    - name: Accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: image
        type: file
        value: []
        description: Escolha uma imagem JPG, PNG ou WEBP de até 5 MB.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
