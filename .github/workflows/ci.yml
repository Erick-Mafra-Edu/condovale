name: Validação

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request-conventions:
    name: Validar título e branch do PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Validar convenções do PR
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|perf|refactor|test|docs|chore|build|ci)(\([a-z0-9._/-]+\))?!?:[[:space:]].+ ]]; then
            echo "::error::O título do PR deve seguir Conventional Commit: tipo, escopo opcional, ! opcional e descrição."
            echo "::error::Exemplo: feat(ocorrencias): permitir encaminhamento"
            exit 1
          fi

          if [[ ! "$PR_BRANCH" =~ ^(feat|fix|perf|refactor|test|docs|chore|build|ci)/[a-z0-9][a-z0-9._/-]*$ ]] && [[ ! "$PR_BRANCH" =~ ^release-please--[a-z0-9][a-z0-9._/-]*$ ]]; then
            echo "::error::A branch do PR deve começar com feat/, fix/, perf/, refactor/, test/, docs/, chore/, build/ ou ci/ e usar somente sufixo seguro em minúsculas."
            echo "::error::Branches release-please--* são permitidas automaticamente."
            exit 1
          fi

          echo "Convenções do título e da branch validadas com sucesso."

  frontend:
    name: Frontend (testes e build)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Gerar configuração Nuxt
        working-directory: frontend
        run: npx nuxt prepare

      - name: Rodar testes
        working-directory: frontend
        run: npm test

      - name: Validar tipos
        working-directory: frontend
        run: npm run typecheck

      - name: Preparar PHP para o contrato de permissões frontend/backend
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, gd, exif, fileinfo
          coverage: none
          tools: composer:v2

      - name: Preparar ambiente Laravel para o contrato de permissões frontend/backend
        working-directory: laravel
        run: cp .env.example .env

      - name: Instalar dependências PHP para o contrato de permissões frontend/backend
        working-directory: laravel
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Gerar chave Laravel para o contrato de permissões frontend/backend
        working-directory: laravel
        run: php artisan key:generate

      - name: Validar contrato de permissões frontend/backend
        working-directory: laravel
        run: php artisan test --compact tests/Unit/FrontendPermissionParityTest.php tests/Unit/PermissionMatrixTest.php

      - name: Validar build
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend (testes e assets)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, gd, exif, fileinfo
          coverage: none
          tools: composer:v2

      # Sem um .env o dotenv reclama em toda requisição e a aplicação fica sem
      # APP_KEY — obrigatória desde a remoção do valor padrão em
      # config/app.php. Os testes tiram a chave do phpunit.xml, mas o que roda
      # fora deles, como o package:discover do composer, não.
      - name: Preparar o ambiente
        working-directory: laravel
        run: cp .env.example .env

      - name: Instalar dependências PHP
        working-directory: laravel
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Gerar a chave da aplicação
        working-directory: laravel
        run: php artisan key:generate

      - name: Rodar testes Laravel
        working-directory: laravel
        run: php artisan test --compact

      - name: Preparar Node.js para os assets Laravel
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências dos assets
        working-directory: laravel
        run: npm install --no-audit --no-fund

      - name: Validar build dos assets
        working-directory: laravel
        run: npm run build
