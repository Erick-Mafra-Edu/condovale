services:
  api:
    build:
      context: ..
      dockerfile: load-tests/Dockerfile
    environment:
      APP_NAME: CondoVale Load Test
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:Q29uZG9WYWxlTG9hZFRlc3RLZXktMjAyNi1TZWVkISE=
      APP_URL: http://api:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: /tmp/condovale-load.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DEPLOY_ENABLED: "false"
    command: >-
      sh -c "touch /tmp/condovale-load.sqlite
      && php artisan migrate:fresh --seed --force
      && php artisan serve --host=0.0.0.0 --port=8000"
    healthcheck:
      test: ["CMD", "php", "-r", "$$s=@fsockopen('127.0.0.1',8000); exit($$s ? 0 : 1);"]
      interval: 5s
      timeout: 10s
      retries: 20

  k6:
    image: grafana/k6:0.54.0
    user: "0:0"
    profiles: [load]
    depends_on:
      api:
        condition: service_healthy
    environment:
      BASE_URL: http://api:8000
      K6_VUS: ${K6_VUS:-50}
      K6_DURATION: ${K6_DURATION:-30s}
    volumes:
      - ./scenarios:/scripts:ro
      - ./results:/results
    command: run /scripts/api-read.js
